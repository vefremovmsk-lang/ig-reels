name: Publish Reel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только отрендерить и дать скачать (НЕ публиковать)"
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1,3,5"    # Пн/Ср/Пт 10:00 МСК (07:00 UTC)

permissions:
  contents: write

concurrency:
  group: publish-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fontconfig
          fc-cache -f >/dev/null

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pick next script
        id: pick
        run: |
          f=$(ls queue/*.json 2>/dev/null | sort | head -n1 || true)
          if [ -z "$f" ]; then
            echo "Queue is empty — nothing to publish."
            echo "empty=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Picked: $f"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "slug=$(basename "$f" .json)" >> "$GITHUB_OUTPUT"

      - name: Render reel
        if: steps.pick.outputs.empty != '1'
        run: |
          python scripts/render.py "${{ steps.pick.outputs.file }}" \
            "media/${{ steps.pick.outputs.slug }}-${{ github.run_id }}.mp4"

      - name: Upload preview artifact
        if: steps.pick.outputs.empty != '1'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pick.outputs.slug }}
          path: media/${{ steps.pick.outputs.slug }}-${{ github.run_id }}.mp4
          retention-days: 14

      - name: Commit media
        if: steps.pick.outputs.empty != '1' && github.event.inputs.dry_run != 'true'
        id: media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "media/${{ steps.pick.outputs.slug }}-${{ github.run_id }}.mp4"
          git commit -m "media: ${{ steps.pick.outputs.slug }} (${{ github.run_id }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Warm media URL (jsDelivr)
        if: steps.pick.outputs.empty != '1' && github.event.inputs.dry_run != 'true'
        id: url
        run: |
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.media.outputs.sha }}/media/${{ steps.pick.outputs.slug }}-${{ github.run_id }}.mp4"
          echo "Media URL: $URL"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -r 0-1 "$URL" || true)
            echo "  attempt $i: HTTP $code"
            if [ "$code" = "206" ] || [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish to Instagram
        if: steps.pick.outputs.empty != '1' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/publish.py "${{ steps.url.outputs.url }}" "media/caption.txt"

      - name: Archive published script
        if: steps.pick.outputs.empty != '1' && github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p published
          git mv "${{ steps.pick.outputs.file }}" "published/${{ steps.pick.outputs.slug }}.json"
          git commit -m "published: ${{ steps.pick.outputs.slug }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
